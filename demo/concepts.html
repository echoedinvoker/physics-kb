<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念星圖 — 物理知識庫</title>
<script
  async crossorigin="anonymous"
  data-clerk-publishable-key="__CLERK_PK__"
  src="https://profound-cobra-43.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --text: #e2e4eb;
    --text2: #8b8fa3;
    --accent: #6c8cff;
    --accent2: #4a6ae5;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 1.1rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .topbar h1 span { color: var(--accent); }
  .topbar .nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.8rem;
    margin-right: 12px;
  }
  .topbar .nav a:hover { text-decoration: underline; }
  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    width: 220px;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text2); }
  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    outline: none;
  }
  .stats {
    font-size: 0.75rem;
    color: var(--text2);
    margin-left: auto;
  }

  /* Main layout */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Side panel */
  .side-panel {
    width: 300px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .side-panel.hidden {
    transform: translateX(300px);
    width: 0;
    padding: 0;
    overflow: hidden;
  }
  .panel-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .panel-desc {
    font-size: 0.85rem;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .panel-section {
    margin-bottom: 16px;
  }
  .panel-section h4 {
    font-size: 0.75rem;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .prereq-chip {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 0.8rem;
    margin: 2px 4px 2px 0;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .prereq-chip:hover { border-color: var(--accent); }
  .ask-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    margin-top: 8px;
  }
  .ask-btn:hover { background: var(--accent2); }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(26, 29, 39, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.7rem;
    color: var(--text2);
    display: flex;
    gap: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1><span>🌌</span> 概念星圖</h1>
  <div class="nav">
    <a href="/">← 問答</a>
    <a href="/exam">模擬考</a>
    <a href="/scan">掃描考卷</a>
    <a href="/benchmark">Benchmark</a>
  </div>
  <input type="text" class="search-box" id="search" placeholder="搜尋概念..." oninput="onSearch(this.value)">
  <select class="filter-select" id="chapterFilter" onchange="onFilter(this.value)">
    <option value="">全部章節</option>
  </select>
  <div class="stats" id="stats">載入中...</div>
</div>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#6c8cff"></div>基礎概念（被多數依賴）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>應用概念（依賴較多前置）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>搜尋結果</div>
    </div>
  </div>
  <div class="side-panel hidden" id="sidePanel">
    <div id="panelContent"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const sidePanel = document.getElementById('sidePanel');
const panelContent = document.getElementById('panelContent');
const statsEl = document.getElementById('stats');

let graph = {};       // name → { title, prerequisites, description }
let nodes = [];       // { name, x, y, r, layer, deps, color }
let edges = [];       // { from: idx, to: idx }
let hoveredNode = -1;
let selectedNode = -1;
let searchTerm = '';
let filterChapter = '';
let chapters = new Set();

// Camera
let camX = 0, camY = 0, zoom = 1;
let dragging = false, dragStartX = 0, dragStartY = 0;

// Sizing
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

// Load data
let masteryData = null;
let userNotesCounts = {}; // concept → count

async function authFetch(url, options = {}) {
  const token = await window.Clerk?.session?.getToken();
  if (token) options.headers = { ...options.headers, Authorization: 'Bearer ' + token };
  return fetch(url, options);
}

async function loadMasteryForGraph() {
  // Wait for Clerk
  for (let i = 0; i < 30; i++) {
    if (window.Clerk) break;
    await new Promise(r => setTimeout(r, 200));
  }
  if (window.Clerk) {
    try {
      await window.Clerk.load();
      if (window.Clerk.user) {
        const [masteryRes, notesRes] = await Promise.all([
          authFetch('/api/mastery'),
          authFetch('/api/notes'),
        ]);
        masteryData = await masteryRes.json();
        const userNotes = await notesRes.json();
        // Count notes per concept
        userNotesCounts = {};
        for (const note of (Array.isArray(userNotes) ? userNotes : [])) {
          for (const c of (note.related_concepts || [])) {
            userNotesCounts[c] = (userNotesCounts[c] || 0) + 1;
          }
        }
        applyMasteryColors();
        draw();
      }
    } catch {}
  }
}

function applyMasteryColors() {
  if (!masteryData) return;
  const unlocked = new Set(masteryData.unlocked || []);
  for (const n of nodes) {
    const m = masteryData.mastery?.[n.name];
    if (!unlocked.has(n.name)) {
      // Prerequisites not met → locked, regardless of any prior attempts
      n.color = '#6c8cff';
      n.masteryStatus = 'locked';
    } else if (m?.isMastered) {
      n.color = '#4ade80'; // green = mastered
      n.masteryStatus = 'mastered';
    } else if (m?.correctCount > 0) {
      n.color = '#fbbf24'; // yellow = in progress
      n.masteryStatus = 'learning';
    } else {
      n.color = '#8b8fa3'; // gray = unlocked but not started
      n.masteryStatus = 'unlocked';
    }
  }
}

fetch('/api/concept-graph')
  .then(r => r.json())
  .then(data => {
    graph = data;
    buildLayout();
    populateChapterFilter();
    resize();
    statsEl.textContent = `${nodes.length} 概念 · ${edges.length} 條前置關係`;
    // Load mastery data and overlay colors
    loadMasteryForGraph();
  });

function buildLayout() {
  const names = Object.keys(graph);
  const nameIdx = {};
  names.forEach((n, i) => nameIdx[n] = i);

  // Count how many concepts depend on each concept
  const depCount = {};
  for (const n of names) depCount[n] = 0;
  for (const n of names) {
    for (const p of graph[n].prerequisites || []) {
      if (depCount[p] !== undefined) depCount[p]++;
    }
  }

  // Topological layers
  const layers = {};
  const visited = new Set();
  function getLayer(name) {
    if (layers[name] !== undefined) return layers[name];
    if (visited.has(name)) return 0; // cycle guard
    visited.add(name);
    const prereqs = graph[name]?.prerequisites || [];
    if (prereqs.length === 0) { layers[name] = 0; return 0; }
    let maxPre = 0;
    for (const p of prereqs) {
      if (graph[p]) maxPre = Math.max(maxPre, getLayer(p) + 1);
    }
    layers[name] = maxPre;
    return maxPre;
  }
  for (const n of names) getLayer(n);

  // Group by layer
  const layerGroups = {};
  for (const n of names) {
    const l = layers[n] || 0;
    if (!layerGroups[l]) layerGroups[l] = [];
    layerGroups[l].push(n);
  }
  const maxLayer = Math.max(...Object.keys(layerGroups).map(Number));

  // Layout: layers top to bottom
  const layerHeight = 100;
  const startY = 60;
  nodes = [];
  for (let l = 0; l <= maxLayer; l++) {
    const group = layerGroups[l] || [];
    const spacing = Math.max(120, 800 / (group.length + 1));
    const startX = -(group.length - 1) * spacing / 2;
    for (let i = 0; i < group.length; i++) {
      const name = group[i];
      const deps = depCount[name] || 0;
      const r = Math.max(6, Math.min(18, 6 + deps * 2));
      const prereqCount = (graph[name].prerequisites || []).length;
      const color = deps >= 3 ? '#6c8cff' : prereqCount >= 2 ? '#4ade80' : '#8b8fa3';
      nodes.push({
        name,
        x: startX + i * spacing,
        y: startY + l * layerHeight,
        r,
        layer: l,
        deps,
        color,
        prereqCount,
      });
    }
  }

  // Rebuild name → index for nodes array
  const nodeIdx = {};
  nodes.forEach((n, i) => nodeIdx[n.name] = i);

  // Build edges
  edges = [];
  for (let i = 0; i < nodes.length; i++) {
    const prereqs = graph[nodes[i].name]?.prerequisites || [];
    for (const p of prereqs) {
      if (nodeIdx[p] !== undefined) {
        edges.push({ from: nodeIdx[p], to: i });
      }
    }
  }

  // Center camera
  if (nodes.length > 0) {
    const cx = nodes.reduce((s, n) => s + n.x, 0) / nodes.length;
    const cy = nodes.reduce((s, n) => s + n.y, 0) / nodes.length;
    camX = -cx;
    camY = -cy;
    // Fit zoom
    const maxX = Math.max(...nodes.map(n => Math.abs(n.x)));
    const maxY = Math.max(...nodes.map(n => Math.abs(n.y)));
    const w = canvas.parentElement.getBoundingClientRect().width;
    const h = canvas.parentElement.getBoundingClientRect().height;
    zoom = Math.min(1.2, w / (maxX * 2 + 200), h / (maxY * 2 + 200));
  }
}

function populateChapterFilter() {
  // Extract chapter info from graph node descriptions/prerequisites
  // Since we don't have chapter in API, extract from naming patterns
  // For now, group by layer
  const sel = document.getElementById('chapterFilter');
  const layerSet = new Set(nodes.map(n => n.layer));
  for (const l of [...layerSet].sort((a,b) => a - b)) {
    const opt = document.createElement('option');
    opt.value = 'layer-' + l;
    opt.textContent = `第 ${l} 層（${nodes.filter(n => n.layer === l).length} 概念）`;
    sel.appendChild(opt);
  }
}

// Drawing
function draw() {
  const w = canvas.parentElement.getBoundingClientRect().width;
  const h = canvas.parentElement.getBoundingClientRect().height;
  ctx.clearRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(camX, camY);

  // Determine visible nodes
  const visibleSet = new Set();
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (filterChapter && 'layer-' + n.layer !== filterChapter) continue;
    if (searchTerm && !n.name.includes(searchTerm)) continue;
    visibleSet.add(i);
  }

  // Highlighted path (hovered or selected)
  const highlightSet = new Set();
  const activeNode = hoveredNode >= 0 ? hoveredNode : selectedNode;
  if (activeNode >= 0 && visibleSet.has(activeNode)) {
    // Trace all ancestors (prerequisites)
    const queue = [activeNode];
    const seen = new Set();
    while (queue.length > 0) {
      const idx = queue.shift();
      if (seen.has(idx)) continue;
      seen.add(idx);
      highlightSet.add(idx);
      for (const e of edges) {
        if (e.to === idx && !seen.has(e.from)) queue.push(e.from);
      }
    }
    // Also trace descendants
    const queue2 = [activeNode];
    const seen2 = new Set();
    while (queue2.length > 0) {
      const idx = queue2.shift();
      if (seen2.has(idx)) continue;
      seen2.add(idx);
      highlightSet.add(idx);
      for (const e of edges) {
        if (e.from === idx && !seen2.has(e.to)) queue2.push(e.to);
      }
    }
  }

  // Draw edges
  for (const e of edges) {
    if (!visibleSet.has(e.from) || !visibleSet.has(e.to)) continue;
    const from = nodes[e.from];
    const to = nodes[e.to];
    const isHighlight = highlightSet.size > 0 && highlightSet.has(e.from) && highlightSet.has(e.to);

    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.strokeStyle = isHighlight ? 'rgba(108,140,255,0.6)' : 'rgba(46,51,69,0.5)';
    ctx.lineWidth = isHighlight ? 2 : 0.5;
    ctx.stroke();

    // Arrow
    if (isHighlight) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const ux = dx/len, uy = dy/len;
      const ax = to.x - ux * (to.r + 4), ay = to.y - uy * (to.r + 4);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - ux*8 + uy*4, ay - uy*8 - ux*4);
      ctx.lineTo(ax - ux*8 - uy*4, ay - uy*8 + ux*4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(108,140,255,0.6)';
      ctx.fill();
    }
  }

  // Draw nodes
  for (let i = 0; i < nodes.length; i++) {
    if (!visibleSet.has(i)) continue;
    const n = nodes[i];
    const isActive = i === activeNode;
    const isHighlighted = highlightSet.size > 0 && highlightSet.has(i);
    const isSearch = searchTerm && n.name.includes(searchTerm);
    const dimmed = highlightSet.size > 0 && !isHighlighted;

    // Glow for mastered nodes
    if (n.masteryStatus === 'mastered' && !dimmed) {
      ctx.save();
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = '#4ade80';
      ctx.fill();
      ctx.restore();
    }

    // Node circle
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    const color = isSearch ? '#fbbf24' : n.color;
    ctx.fillStyle = dimmed ? color + '33' : (n.masteryStatus === 'locked' ? color + '66' : color);
    ctx.fill();

    if (isActive) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Lock icon for locked nodes
    if (n.masteryStatus === 'locked' && !dimmed) {
      ctx.fillStyle = 'rgba(226,228,235,0.5)';
      ctx.font = `${Math.max(8, n.r * 0.8)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔒', n.x, n.y);
    }

    // Label
    ctx.fillStyle = dimmed ? 'rgba(226,228,235,0.2)' : 'rgba(226,228,235,0.9)';
    ctx.font = (isActive ? '600 ' : '') + '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(n.name, n.x, n.y + n.r + 14);
  }

  ctx.restore();
}

// Interaction
function screenToWorld(sx, sy) {
  const w = canvas.parentElement.getBoundingClientRect().width;
  const h = canvas.parentElement.getBoundingClientRect().height;
  return {
    x: (sx - w/2) / zoom - camX,
    y: (sy - h/2) / zoom - camY,
  };
}

function findNode(mx, my) {
  const { x, y } = screenToWorld(mx, my);
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const dx = x - n.x, dy = y - n.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < n.r + 8 && dist < bestDist) {
      bestDist = dist;
      best = i;
    }
  }
  return best;
}

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    camX += dx / zoom;
    camY += dy / zoom;
    draw();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  hoveredNode = findNode(e.clientX - rect.left, e.clientY - rect.top);
  canvas.style.cursor = hoveredNode >= 0 ? 'pointer' : 'grab';
  draw();
});

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const node = findNode(e.clientX - rect.left, e.clientY - rect.top);
  if (node >= 0) {
    selectedNode = node;
    showPanel(node);
    draw();
  } else {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mouseup', () => {
  dragging = false;
  canvas.style.cursor = hoveredNode >= 0 ? 'pointer' : 'grab';
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = -1;
  dragging = false;
  draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.2, Math.min(3, zoom * factor));
  draw();
}, { passive: false });

function showPanel(idx) {
  const n = nodes[idx];
  const info = graph[n.name];
  sidePanel.classList.remove('hidden');

  const prereqs = (info?.prerequisites || [])
    .map(p => `<span class="prereq-chip" onclick="focusNode('${p.replace(/'/g, "\\'")}')">${esc(p)}</span>`)
    .join('');

  // Find dependents (concepts that require this one)
  const dependents = nodes
    .filter(nd => (graph[nd.name]?.prerequisites || []).includes(n.name))
    .map(nd => `<span class="prereq-chip" onclick="focusNode('${nd.name.replace(/'/g, "\\'")}')">${esc(nd.name)}</span>`)
    .join('');

  // Mastery info
  let masteryHtml = '';
  if (masteryData) {
    const m = masteryData.mastery?.[n.name];
    const status = n.masteryStatus || 'unlocked';
    if (status === 'mastered') {
      masteryHtml = '<div class="panel-section"><h4>掌握度</h4><span style="color:var(--green)">✓ 已掌握</span></div>';
    } else if (status === 'learning') {
      const count = m?.correctCount || 0;
      const bar = '●'.repeat(count) + '○'.repeat(3 - count);
      masteryHtml = `<div class="panel-section"><h4>掌握度</h4><span style="color:#fbbf24">${bar} (${count}/3)</span></div>`;
    } else if (status === 'locked') {
      const needed = (graph[n.name]?.prerequisites || []).filter(p => !masteryData.mastery?.[p]?.isMastered);
      masteryHtml = `<div class="panel-section"><h4>掌握度</h4><span style="color:var(--text2)">🔒 需要先掌握：${needed.join('、')}</span></div>`;
    } else {
      masteryHtml = '<div class="panel-section"><h4>掌握度</h4><span style="color:var(--text2)">尚未開始</span></div>';
    }
  }

  panelContent.innerHTML = `
    <div class="panel-title">${esc(n.name)}</div>
    <div class="panel-desc">${esc(info?.description || '（無描述）')}</div>
    ${masteryHtml}
    ${prereqs ? `<div class="panel-section"><h4>前置概念</h4>${prereqs}</div>` : '<div class="panel-section"><h4>前置概念</h4><span style="color:var(--green);font-size:0.8rem">無（可直接學習）</span></div>'}
    ${dependents ? `<div class="panel-section"><h4>延伸概念</h4>${dependents}</div>` : ''}
    ${(userNotesCounts[n.name] || 0) > 0 ? `<div class="panel-section"><h4>📝 我的筆記（${userNotesCounts[n.name]} 則）</h4></div>` : ''}
    <a class="ask-btn" href="/?q=${encodeURIComponent('什麼是' + n.name + '？')}" target="_blank">問問看 →</a>
    ${(!masteryData || (n.masteryStatus || 'unlocked') !== 'locked') ? `<a class="ask-btn" href="/exam?concept=${encodeURIComponent(n.name)}" target="_blank" style="background:var(--green);color:#000;margin-top:8px">🎯 練習這個概念</a>` : ''}
  `;
}

function focusNode(name) {
  const idx = nodes.findIndex(n => n.name === name);
  if (idx < 0) return;
  selectedNode = idx;
  const n = nodes[idx];
  camX = -n.x;
  camY = -n.y;
  showPanel(idx);
  draw();
}

function onSearch(val) {
  searchTerm = val.trim();
  // If exact match, focus on it
  if (searchTerm) {
    const idx = nodes.findIndex(n => n.name === searchTerm);
    if (idx >= 0) {
      selectedNode = idx;
      camX = -nodes[idx].x;
      camY = -nodes[idx].y;
      showPanel(idx);
    }
  }
  draw();
}

function onFilter(val) {
  filterChapter = val;
  draw();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
