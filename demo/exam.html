<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理知識庫 - 模擬考</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script
  async crossorigin="anonymous"
  data-clerk-publishable-key="__CLERK_PK__"
  src="https://profound-cobra-43.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --text: #e2e4eb;
    --text2: #8b8fa3;
    --accent: #6c8cff;
    --accent2: #4a6ae5;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header p { margin-top: 6px; color: var(--text2); font-size: 0.85rem; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  main {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Setup panel */
  .setup { margin-bottom: 32px; }
  .setup h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .setup-row {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .setup-row label { font-size: 0.85rem; color: var(--text2); min-width: 60px; }

  .chapter-checks { display: flex; gap: 8px; flex-wrap: wrap; }
  .chapter-checks label {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chapter-checks label:hover { border-color: var(--accent); }
  .chapter-checks input:checked + span { color: var(--accent); }
  .chapter-checks input { display: none; }

  .diff-radios { display: flex; gap: 8px; }
  .diff-radios label {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .diff-radios label:hover { border-color: var(--accent); }
  .diff-radios input:checked + span { color: var(--accent); }
  .diff-radios input { display: none; }

  .count-slider {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .count-slider input[type=range] {
    width: 150px;
    accent-color: var(--accent);
  }
  .count-slider .count-val {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
    min-width: 30px;
  }

  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s;
  }
  .start-btn:hover { background: var(--accent2); }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Timer */
  .timer {
    position: fixed;
    top: 16px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    z-index: 10;
  }
  .timer.warning { color: var(--yellow); border-color: var(--yellow); }
  .timer.danger { color: var(--red); border-color: var(--red); }

  /* Question */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .question-num { font-size: 0.85rem; color: var(--accent); font-weight: 600; }
  .question-meta { font-size: 0.75rem; color: var(--text2); }
  .question-body { line-height: 1.7; font-size: 0.95rem; margin-bottom: 16px; }
  .question-body .katex-display { margin: 12px 0; }

  .option-list { list-style: none; }
  .option-list li {
    padding: 10px 16px;
    margin: 6px 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.9rem;
  }
  .option-list li:hover { border-color: var(--accent); }
  .option-list li.selected {
    border-color: var(--accent);
    background: rgba(108, 140, 255, 0.1);
  }

  .text-answer {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
  }
  .text-answer:focus { border-color: var(--accent); }

  /* Submit */
  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 16px;
    text-align: center;
  }
  .submit-btn {
    background: var(--green);
    color: #000;
    border: none;
    padding: 12px 40px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .submit-btn:hover { opacity: 0.9; }

  /* Results */
  .score-card {
    text-align: center;
    padding: 32px;
    margin-bottom: 24px;
  }
  .score-number {
    font-size: 4rem;
    font-weight: 700;
  }
  .score-number.pass { color: var(--green); }
  .score-number.fail { color: var(--red); }
  .score-label { font-size: 1rem; color: var(--text2); margin-top: 8px; }
  .overtime-badge {
    display: inline-block;
    background: rgba(248, 113, 113, 0.15);
    color: var(--red);
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    margin-top: 8px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .result-card.correct { border-left: 3px solid var(--green); }
  .result-card.wrong { border-left: 3px solid var(--red); }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .result-status { font-weight: 600; font-size: 0.85rem; }
  .result-status.correct { color: var(--green); }
  .result-status.wrong { color: var(--red); }
  .result-answers { font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
  .result-analysis {
    font-size: 0.9rem;
    line-height: 1.6;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .result-concepts {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text2);
  }
  .result-concepts a { color: var(--green); text-decoration: none; }

  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1><span>&#x1F4DD;</span> 物理知識庫 模擬考</h1>
  <p>從 210 題題庫組卷 &bull; 計時作答 &bull; 自動評分 &bull; <a href="/">回到問答</a></p>
</header>

<main>
  <!-- Setup -->
  <div id="setup" class="setup">
    <h2>考卷設定</h2>
    <div class="setup-row">
      <label>章節</label>
      <div class="chapter-checks" id="chapterChecks">
        <label><input type="checkbox" value="1-1"><span>1-1 物理學簡史</span></label>
        <label><input type="checkbox" value="1-2"><span>1-2 物理與生活</span></label>
        <label><input type="checkbox" value="1-3"><span>1-3 物理與測量</span></label>
      </div>
    </div>
    <div class="setup-row">
      <label>難度</label>
      <div class="diff-radios" id="diffRadios">
        <label><input type="radio" name="diff" value=""><span>不限</span></label>
        <label><input type="radio" name="diff" value="basic"><span>基礎</span></label>
        <label><input type="radio" name="diff" value="intermediate" checked><span>中等</span></label>
        <label><input type="radio" name="diff" value="advanced"><span>進階</span></label>
      </div>
    </div>
    <div class="setup-row">
      <label>題數</label>
      <div class="count-slider">
        <input type="range" id="countSlider" min="3" max="20" value="10" oninput="document.getElementById('countVal').textContent=this.value">
        <span class="count-val" id="countVal">10</span> 題
      </div>
    </div>
    <div class="setup-row">
      <label>時限</label>
      <div class="count-slider">
        <input type="range" id="timeSlider" min="5" max="60" value="20" step="5" oninput="document.getElementById('timeVal').textContent=this.value">
        <span class="count-val" id="timeVal">20</span> 分鐘
      </div>
    </div>
    <button class="start-btn" id="startBtn" onclick="startExam()">開始考試</button>
  </div>

  <!-- Exam -->
  <div id="examArea" class="hidden"></div>
  <div id="timerEl" class="timer hidden"></div>

  <!-- Results -->
  <div id="resultArea" class="hidden"></div>
</main>

<div id="submitBar" class="submit-bar hidden">
  <button class="submit-btn" onclick="submitExam()">交卷</button>
</div>

<script>
let examId = null;
let questions = [];
let answers = {};
let timerInterval = null;
let remainingSeconds = 0;
let noteMap = {};

fetch('/api/note-map').then(r => r.json()).then(m => { noteMap = m; });

async function startExam() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '出題中...';

  const chapters = [...document.querySelectorAll('#chapterChecks input:checked')].map(i => i.value);
  const diff = document.querySelector('#diffRadios input:checked')?.value ?? '';
  const count = parseInt(document.getElementById('countSlider').value);
  const timeMinutes = parseInt(document.getElementById('timeSlider').value);

  try {
    const res = await fetch('/api/exam/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chapters, difficulty: diff, count, timeLimit: timeMinutes * 60 }),
    });
    const data = await res.json();
    examId = data.examId;
    questions = data.questions;
    answers = {};
    renderExam();
    startTimer(timeMinutes * 60);
  } catch (err) {
    alert('出題失敗：' + err.message);
    btn.disabled = false;
    btn.textContent = '開始考試';
  }
}

function renderExam() {
  document.getElementById('setup').classList.add('hidden');
  const area = document.getElementById('examArea');
  area.classList.remove('hidden');
  document.getElementById('submitBar').classList.remove('hidden');

  let html = '';
  questions.forEach((q, i) => {
    const bodyHtml = marked.parse(q.content);
    const isChoice = q.type.includes('choice');

    html += `<div class="question-card" id="q-${q.id}">
      <div class="question-header">
        <span class="question-num">第 ${i + 1} 題</span>
        <span class="question-meta">${q.chapter ? 'Ch.' + q.chapter : ''} ${q.difficulty || ''}</span>
      </div>
      <div class="question-body">${bodyHtml}</div>`;

    if (isChoice && q.options && q.options.length > 0) {
      html += `<ul class="option-list" data-qid="${q.id}">`;
      q.options.forEach(opt => {
        const m = opt.match(/[A-E]/);
        const letter = m ? m[0] : '';
        html += `<li data-letter="${letter}" onclick="toggleOption(this, '${q.id}', '${letter}')">${esc(opt)}</li>`;
      });
      html += `</ul>`;
    } else {
      html += `<input type="text" class="text-answer" data-qid="${q.id}" placeholder="輸入答案..."
        oninput="answers[this.dataset.qid]=this.value">`;
    }

    html += `</div>`;
  });

  area.innerHTML = html;
  renderMathInArea(area);
}

function toggleOption(li, qid, letter) {
  li.classList.toggle('selected');
  const selected = [...li.parentElement.querySelectorAll('.selected')].map(l => l.dataset.letter).sort().join('');
  answers[qid] = selected;
}

function startTimer(seconds) {
  remainingSeconds = seconds;
  const timerEl = document.getElementById('timerEl');
  timerEl.classList.remove('hidden');
  updateTimer();
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimer();
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      submitExam();
    }
  }, 1000);
}

function updateTimer() {
  const timerEl = document.getElementById('timerEl');
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  timerEl.className = 'timer' +
    (remainingSeconds <= 60 ? ' danger' : remainingSeconds <= 300 ? ' warning' : '');
}

async function authFetch(url, options = {}) {
  const token = await window.Clerk?.session?.getToken();
  if (token) {
    options.headers = { ...options.headers, Authorization: 'Bearer ' + token };
  }
  return fetch(url, options);
}

async function submitExam() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('submitBar').classList.add('hidden');
  document.getElementById('timerEl').classList.add('hidden');

  try {
    const res = await fetch('/api/exam/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ examId, answers }),
    });
    const result = await res.json();
    renderResults(result);

    // Fire-and-forget: batch record attempts to Supabase
    if (window.Clerk?.user && result.details) {
      const attempts = result.details.map(d => ({
        questionId: d.id,
        isCorrect: d.isCorrect,
      }));
      authFetch('/api/attempts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attempts }),
      }).catch(() => {});
    }
  } catch (err) {
    alert('評分失敗：' + err.message);
  }
}

function renderResults(result) {
  document.getElementById('examArea').classList.add('hidden');
  const area = document.getElementById('resultArea');
  area.classList.remove('hidden');

  const passClass = result.score >= 60 ? 'pass' : 'fail';
  let html = `<div class="score-card">
    <div class="score-number ${passClass}">${result.score}</div>
    <div class="score-label">答對 ${result.details.filter(d => d.isCorrect).length} / ${result.total} 題</div>
    ${result.overtime ? '<div class="overtime-badge">超時作答</div>' : ''}
  </div>`;

  result.details.forEach((d, i) => {
    const cls = d.isCorrect ? 'correct' : 'wrong';
    const statusText = d.isCorrect ? '正確' : '錯誤';
    const conceptLinks = d.relatedConcepts.map(c => {
      const url = noteMap[c];
      return url ? `<a href="${url}" target="_blank">${esc(c)}</a>` : esc(c);
    }).join('、');

    html += `<div class="result-card ${cls}">
      <div class="result-header">
        <span class="question-num">第 ${i + 1} 題</span>
        <span class="result-status ${cls}">${statusText}</span>
      </div>
      <div class="result-answers">你的答案：${esc(d.submitted)} ｜ 正確答案：${esc(d.correct)}</div>
      ${d.analysis ? `<div class="result-analysis">${marked.parse(d.analysis)}</div>` : ''}
      ${conceptLinks ? `<div class="result-concepts">相關概念：${conceptLinks}</div>` : ''}
    </div>`;
  });

  html += `<div style="text-align:center;margin:32px 0">
    <button class="start-btn" onclick="location.reload()">再考一次</button>
  </div>`;

  area.innerHTML = html;
  renderMathInArea(area);
}

function renderMathInArea(container) {
  container.querySelectorAll('.question-body, .result-analysis').forEach(node => {
    node.querySelectorAll('p, li, td').forEach(el => {
      if (!el.innerHTML.includes('$')) return;
      el.innerHTML = el.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => {
        try { return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }); }
        catch { return `$$${tex}$$`; }
      });
      el.innerHTML = el.innerHTML.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        try { return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false }); }
        catch { return `$${tex}$`; }
      });
    });
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
